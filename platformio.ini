; PlatformIO project for Claudeputer
; M5Stack Cardputer client for the Claude (Anthropic) API
;
; Build & flash from VS Code + PlatformIO, or:
;   pio run -e cardputer -t upload
;   pio device monitor

[platformio]
default_envs = cardputer

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.0.3
    bblanchon/ArduinoJson@^7.0.0

; --- Cardputer 1.1 (ESP32-S3, StampS3) ---
[env:cardputer]
board = m5stack-stamps3
board_build.arduino.memory_type = qio_opi   ; enable 8MB PSRAM
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; --- Cardputer ADV (experimental — same SoC family) ---
; The ADV uses the same ESP32-S3 platform. If the M5Cardputer library
; misbehaves on the ADV, check M5Stack's repo for an ADV-specific branch.
[env:cardputer_adv]
board = m5stack-stamps3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCARDPUTER_ADV
