; PlatformIO project for Claudeputer
; M5Stack Cardputer client for the Claude (Anthropic) API
;
; The same binary runs on BOTH the Cardputer 1.1 and the Cardputer ADV:
; M5Cardputer >= 1.2.0 auto-detects the board at runtime and picks the correct
; keyboard driver. The `cardputer` env below is the one used for releases /
; the web flasher; `cardputer_adv` is kept as an explicit alias.
;
; Build & flash:
;   pio run -e cardputer -t upload
;   pio device monitor

[platformio]
default_envs = cardputer

[env]
platform = espressif32
framework = arduino
board = m5stack-stamps3
board_build.arduino.memory_type = qio_opi   ; 8MB PSRAM (OPI) + QIO flash
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Cardputer@^1.2.0   ; >= 1.2.0 adds Cardputer ADV support
    bblanchon/ArduinoJson@^7.0.0

; --- Cardputer 1.1 / universal (default) -------------------------------------
[env:cardputer]

; --- Cardputer ADV (explicit alias; produces an equivalent binary) -----------
; The firmware auto-detects ADV at runtime, so this builds the same image.
; Kept separate only for clarity in CI / local workflows.
[env:cardputer_adv]
build_flags =
    ${env.build_flags}
    -DCARDPUTER_ADV
